name: QueryRe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore QueryRe.sln

      - name: Build
        run: dotnet build QueryRe.sln -c Release --no-restore

      - name: Test
        run: dotnet test QueryRe.Tests -c Release --no-build

      - name: Publish the web app
        run: dotnet publish QueryRe.Web -c Release --no-build -o publish

      - name: Save the published app
        uses: actions/upload-artifact@v4
        with:
          name: queryre
          path: publish/

  docker-check:
    runs-on: ubuntu-latest
    needs: build-test-publish

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t queryre:ci .
